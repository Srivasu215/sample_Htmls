<!doctype html>
<html lang="en" data-bs-theme="light">

<head>
    <title>Title</title>
    <!-- Required meta tags -->
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <!-- Bootstrap CSS v5.3.8 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous" />
    <style>
        .nav-link:hover {
            color: #0d6efd !important;
        }
    </style>
</head>

<body>
    <div class="container">
    <header>
        <div class="px-3 py-2 text-bg-dark border-bottom">
            <div class="container">
                <div class="d-flex flex-wrap align-items-center justify-content-center justify-content-lg-start">

                    <a href="index.html"
                        class="d-flex align-items-center my-2 my-lg-0 me-lg-auto text-white text-decoration-none">
                        <i class="bi bi-bootstrap-fill fs-2"></i>
                    </a>

                    <ul class="nav col-12 col-lg-auto my-2 justify-content-center my-md-0 text-small">

                        <li>
                            <a href="index.html" class="nav-link text-white text-center">
                                <i class="bi bi-house-door-fill d-block mx-auto mb-1 fs-5"></i>
                                Home
                            </a>
                        </li>

                        <li>
                            <a href="header.html" class="nav-link text-primary text-center" aria-current="page">
                                <i class="bi bi-layout-text-window-reverse d-block mx-auto mb-1 fs-5"></i>
                                Header
                            </a>
                        </li>

                        <li>
                            <a href="footer.html" class="nav-link text-white text-center">
                                <i class="bi bi-layout-text-window d-block mx-auto mb-1 fs-5"></i>
                                Footer
                            </a>
                        </li>

                        <li>
                            <a href="footer_header.html" class="nav-link text-white text-center">
                                <i class="bi bi-grid-fill d-block mx-auto mb-1 fs-5"></i>
                                Footer Header
                            </a>
                        </li>

                    </ul>
                </div>
            </div>
        </div>
    </header>
    <main></main>

    </div>
    <!-- Bootstrap JavaScript Bundle (includes Popper) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

    <script>
        // Ensure active page is highlighted blue
        document.addEventListener("DOMContentLoaded", function () {
            const currentPage = window.location.pathname.split("/").pop() || "index.html";
            document.querySelectorAll(".nav-link").forEach(link => {
                const href = link.getAttribute("href");
                if (href === currentPage) {
                    link.classList.remove("text-white");
                    link.classList.add("text-primary");
                    link.setAttribute("aria-current", "page");
                }
            });
        });
    </script>
</body>

</html>
